# 字型庫登錄表（minna-fonts-tomo）
# 供文件及繪圖工具共用。工具依自己的需求，只取用到的字型（見 README）。
#
# 收錄原則：
#   - 只收 TrueType（glyf 外框）且為固定字重的字型：OTF（CFF）與可變字重（variable）字型，
#     在 Chromium／Vivliostyle 產生 PDF 時會被存成 Type 3（實測），文字難以選取複製、檔案暴增。
#   - 授權允許商用、嵌入 PDF、隨 repo 散布；原樣保存，不修改字形、不轉換格式。
#   - id 結尾 -ttf 標示 TrueType。
#
# 欄位：
#   name        名稱            category   類別（楷書／明體／黑體／等寬／西文／符號）
#   path        資料夾：依類別放在 kai／serif／sans／mono／latin／symbols 之下
#   languages   主要語言        appearance 外觀            use   適用場合
#   license     授權            commercial／embed／redistribute  可否商用／嵌入 PDF／隨 repo 散布
#   outline     外框格式        pdf_chromium  Chromium 產生 PDF 時的內嵌方式（實測）
#   source      官方來源        version    版本（換版本會讓 repo 歷史變大，須先確認）
#   files       字型檔。faces 有列的為各字重、字體；沒列的依序作為補字（例：全字庫的擴充區）
#   faces       字型檔 → "字重" 或 "字重 italic"（CSS font-weight／font-style）
#   license_files  授權文件
#   download    下載方式：zip（壓縮檔）／7z（7-Zip 壓縮檔）／deb（Debian 套件）／google（Google Fonts 官方下載清單的固定字重 TrueType）


